<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Cyberduel</title>
    <link rel="stylesheet" type="text/css" href="css/style.css" />
  </head>

  <body>
    <!-- 1. Phaser precisa ser o primeiro -->
    <script src="phaser.js"></script>
    <script src="/socket.io/socket.io.js"></script>

    <!-- 2. Dados das cartas: carregue antes de main.js (é onde ficam a
         classe Carta, os tipos de efeito e o pool de cartas de efeito) -->
    <script src="js/cartas.js"></script>
    <script src="js/deck-builder.js"></script>
    <script src="js/multiplayer.js"></script>

    <!-- 3. Carregue as cenas ANTES do main.js. A ordem entre elas não
         importa pro Phaser em si (quem decide a ordem de execução é o
         array "scene" em main.js), mas jogo.js precisa vir antes de
         preload.js/titulo.js porque é lá que ficam as constantes GW/GH
         usadas nas outras duas. -->
    <script src="js/cenas/jogo.js"></script>
    <script src="js/cenas/deck-builder.js"></script>
    <script src="js/cenas/preload.js"></script>
    <script src="js/cenas/titulo.js"></script>
    <script src="js/cenas/transicao.js"></script>

    <!-- 4. main.js por último (ele inicia o jogo) -->
    <script src="js/main.js"></script>
  </body>
</html>
