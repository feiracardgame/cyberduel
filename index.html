<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Cyberduel</title>
    <link rel="stylesheet" type="text/css" href="css/style.css?v=20260916-revisao" />
  </head>

  <body>
    <div id="game-viewport" aria-label="Área do jogo"></div>
    <script src="js/viewport.js?v=20260916-viewport"></script>
    <!-- 1. Phaser carrega antes das classes do jogo. -->
    <script src="phaser.js"></script>
    <!-- Cliente local: também funciona no Live Server, que não expõe
         automaticamente a rota /socket.io/socket.io.js do backend. -->
    <script src="js/vendor/socket.io.min.js?v=20260910-humbanet"></script>
    <script src="js/server-url.js?v=20260915-local"></script>
    <script src="js/settings.js?v=20260910-humbanet"></script>

    <!-- 2. Dados das cartas: carregue antes de main.js (é onde ficam a
         classe Carta, os tipos de efeito e o pool de cartas de efeito) -->
    <script src="js/cartas.js?v=20260911-habilidades"></script>
    <script src="js/account.js?v=20260916-boosters"></script>
    <script src="js/deck-builder.js?v=20260910-humbanet"></script>
    <script src="js/deck-builder-ui.js?v=20260910-humbanet"></script>
    <script src="js/multiplayer.js?v=20260915-local"></script>
    <script src="js/title-ui.js?v=20260916-boosters"></script>

    <!-- 3. Carregue as cenas ANTES do main.js. A ordem entre elas não
         importa pro Phaser em si (quem decide a ordem de execução é o
         array "scene" em main.js), mas jogo.js precisa vir antes de
         preload.js/titulo.js porque é lá que ficam as constantes GW/GH
         usadas nas outras duas. -->
    <script src="js/cenas/efeitos.js?v=20260916-fila-invocacao"></script>
    <script src="js/cenas/jogo.js?v=20260916-fila-invocacao"></script>
    <script src="js/cenas/deck-builder.js?v=20260910-humbanet"></script>
    <script src="js/cenas/preload.js?v=20260916-revisao"></script>
    <script src="js/cenas/titulo.js?v=20260910-humbanet"></script>
    <script src="js/cenas/transicao.js?v=20260916-resolucao"></script>

    <!-- 4. main.js por último (ele inicia o jogo) -->
    <script src="js/main.js?v=20260916-revisao"></script>
    <script src="js/debug.js?v=20260916-debug"></script>
  </body>
</html>
