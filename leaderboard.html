<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#020b05" />
    <meta name="description" content="Os dez Cyberduelistas do Conselho. Classificação por influência atualizada ao vivo." />
    <base href="/" />
    <title>Leaderboard · O Conselho · Cyberduel</title>
    <link rel="icon" href="favicon.ico" />
    <link rel="stylesheet" href="css/leaderboard.css?v=20261012" />
    <link rel="stylesheet" href="css/server-notices.css?v=20261015" />
    <script defer src="js/server-url.js?v=20260922-nitidez"></script>
    <script defer src="js/vendor/socket.io.min.js?v=20260910-humbanet"></script>
    <script defer src="js/server-notices.js?v=20261015"></script>
    <script defer src="js/leaderboard.js?v=20261012"></script>
  </head>
  <body>
    <div class="code-rain" aria-hidden="true"></div>
    <main class="council-board" aria-labelledby="council-title">
      <header class="council-header">
        <h1 id="council-title" class="sr-only">O Conselho — Leaderboard</h1>
        <img src="assets/leaderboard/conselho-header.png" alt="Troféu dourado com uma esmeralda e o título O Conselho" width="2056" height="765" fetchpriority="high" />
      </header>
      <table class="council-table" aria-label="Top 10 Cyberduelistas por influência">
        <colgroup><col class="position-col" /><col class="portrait-col" /><col class="identity-col" /><col class="influence-col" /></colgroup>
        <thead><tr><th scope="col">#</th><th scope="col" colspan="2"><span class="sr-only">Cyberduelista</span></th><th scope="col">INFLUÊNCIA</th></tr></thead>
        <tbody id="leaderboard-rows"></tbody>
      </table>
      <p id="leaderboard-empty" class="board-message" hidden>Nenhum duelista no Conselho ainda.<small>São necessárias 5 partidas e 3 vitórias contra jogadores.</small></p>
      <footer class="board-footer"><span class="connection-light" aria-hidden="true"></span><p id="leaderboard-status" role="status">Conectando ao ranking…</p></footer>
    </main>
  </body>
</html>
